<style>
  :root{
    --ui-bg:#f4f5f7; --ui-panel:#fff; --ui-border:#e3e6ea; --ui-text:#1b1f24; --ui-muted:#6b7480; --ui-accent:#1d9bf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ui-bg);color:var(--ui-text)}
  .app{display:grid;grid-template-columns:var(--sidebar-w,420px) 1fr;height:100vh;position:relative}
  .app.no-sidebar{grid-template-columns:1fr}
  .resizer{position:absolute;top:0;bottom:0;left:calc(var(--sidebar-w,420px) - 4px);width:8px;cursor:col-resize;z-index:5}
  .resizer::after{content:'';position:absolute;top:0;bottom:0;left:3px;width:2px;background:transparent;transition:background .15s}
  .resizer:hover::after,.resizer.active::after{background:var(--ui-accent)}
  .app.no-sidebar .resizer{display:none}
  body.resizing{cursor:col-resize;user-select:none}
  .app.no-sidebar #editor{display:none}
  .sb-toggle{display:flex;align-items:center;gap:6px;padding:7px 9px}
  .sb-toggle svg{width:16px;height:16px}
  /* ---------- Editor ---------- */
  #editor{overflow-y:auto;padding:16px;border-right:1px solid var(--ui-border);background:var(--ui-bg)}
  .card{background:var(--ui-panel);border:1px solid var(--ui-border);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ui-muted)}
  .lbl{display:block;font-size:12px;font-weight:600;color:var(--ui-muted);margin:10px 0 4px}
  input[type=text],input:not([type]),input[type=url],input[type=datetime-local],select,textarea{
    width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--ui-border);border-radius:8px;background:#fff;color:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--ui-accent);box-shadow:0 0 0 3px rgba(29,155,240,.15)}
  textarea{resize:vertical;min-height:90px;line-height:1.4}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .row5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  .row5 input{padding:6px 7px;font-size:13px}
  .row2 .lbl,.row5 .lbl{margin-top:8px}
  .at{display:flex;align-items:center;border:1px solid var(--ui-border);border-radius:8px;background:#fff;padding-left:10px}
  .at span{color:var(--ui-muted)} .at input{border:0;box-shadow:none!important;padding-left:2px}
  .flex{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .grow{flex:1;min-width:0}
  .btn{font:inherit;font-size:13px;font-weight:600;padding:7px 11px;border-radius:8px;border:1px solid var(--ui-border);background:#fff;color:var(--ui-text);cursor:pointer;white-space:nowrap}
  .btn:hover{background:#f0f2f5}
  .btn.primary{background:var(--ui-text);color:#fff;border-color:var(--ui-text)}
  .btn.primary:hover{background:#000}
  .btn.add{width:100%;padding:11px;border-style:dashed;color:var(--ui-accent);background:transparent}
  .btn.add:hover{background:rgba(29,155,240,.06)}
  .ib{border:0;background:transparent;cursor:pointer;width:28px;height:28px;border-radius:6px;color:var(--ui-muted);font-size:14px}
  .ib:hover:not(:disabled){background:#eef0f3;color:var(--ui-text)} .ib:disabled{opacity:.3;cursor:default}
  .ib.danger:hover:not(:disabled){background:#fde8ea;color:#d4213d}
  .seg{display:flex;background:#eef0f3;border-radius:9px;padding:3px;gap:2px}
  .seg button{flex:1;font:inherit;font-size:13px;border:0;background:transparent;padding:6px 8px;border-radius:7px;cursor:pointer;color:var(--ui-muted)}
  .seg button.on{background:#fff;color:var(--ui-text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:10px;cursor:pointer}
  .row-av{display:flex;gap:10px;align-items:flex-end}
  .av-thumb.sq{border-radius:6px}
  .av-thumb{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;background:#ddd;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
  .tc-h{display:flex;align-items:center;gap:2px;margin-bottom:8px}
  .tc-h b{font-size:14px} .sp{flex:1}
  .counter{font-size:12px;color:var(--ui-muted);text-align:right;margin-top:4px}
  .counter.over{color:#d4213d;font-weight:600}
  .media-list{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
  .mthumb{position:relative;width:64px;height:64px;border-radius:8px;overflow:hidden;background:#000}
  .mthumb img,.mthumb video{width:100%;height:100%;object-fit:cover;display:block}
  .mthumb .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:12px;line-height:20px;padding:0}
  .mrow{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ui-muted);margin-top:4px;min-height:28px}
  .mrow .chk{margin:0;font-size:12px}
  .mrow input.dur-in{width:74px;padding:4px 6px;font-size:12px}
  .mthumb .tag{position:absolute;left:3px;bottom:3px;background:rgba(0,0,0,.7);color:#fff;font-size:10px;padding:0 4px;border-radius:3px}
  .hint{font-size:11px;color:var(--ui-muted);margin-top:6px}
  .tcard.drag{border-color:var(--ui-accent);background:#f2f9ff}
  .sub{border-left:3px solid var(--ui-border);padding-left:10px;margin-top:6px}
  .preset-bar{display:flex;gap:6px;align-items:center;margin-bottom:4px}
  .preset-bar select{flex:1;min-width:0;padding:6px 8px;font-size:13px}
  .btn.sm{padding:6px 9px;font-size:12px}
  details.more{margin-top:12px;border-top:1px solid var(--ui-border);padding-top:10px}
  details.more summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:6px;font-size:13px;font-weight:600;color:var(--ui-text);user-select:none}
  details.more summary::-webkit-details-marker{display:none}
  details.more summary::before{content:'';width:0;height:0;border-left:5px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s;align-self:center}
  details.more[open] summary::before{transform:rotate(90deg)}
  details.more summary:hover{color:var(--ui-accent)}
  .more-hint{font-weight:400;color:var(--ui-muted);font-size:12px}
  details.more[open] .more-hint{display:none}
  .more-body{padding-top:2px}
  .thread-h{display:flex;align-items:center;margin:18px 2px 8px}
  .thread-h h3{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ui-muted)}
  input[type=range]{width:100%}

  /* ---------- Stage ---------- */
  .stage{display:flex;flex-direction:column;min-width:0}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ui-border);background:var(--ui-panel)}
  .toolbar .sp{flex:1}
  .toolbar .sep{width:1px;height:22px;background:var(--ui-border);margin:0 2px}
  /* canvas switcher */
  .cv-wrap{position:relative}
  .cv-btn{display:flex;align-items:center;gap:7px;max-width:240px}
  .cv-btn svg{width:15px;height:15px;flex:none;color:var(--ui-muted)}
  #cv-name{overflow:hidden;text-overflow:ellipsis}
  .cv-caret{color:var(--ui-muted);font-size:11px}
  .cv-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:270px;max-height:70vh;overflow-y:auto;background:#fff;border:1px solid var(--ui-border);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.14);padding:6px;z-index:20}
  .cv-menu[hidden]{display:none}
  .cv-head{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ui-muted);padding:6px 10px 4px}
  .cv-item{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;font:inherit;font-size:13px;padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left;color:var(--ui-text)}
  .cv-item:hover{background:#f0f2f5}
  .cv-item .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cv-item .c{color:var(--ui-muted);font-size:12px}
  .cv-item.cur{font-weight:600}
  .cv-item.danger{color:#d4213d}
  .cv-check{width:14px;flex:none;color:var(--ui-accent)}
  .cv-sep{height:1px;background:var(--ui-border);margin:6px 4px}
  /* infinite canvas */
  .canvas{flex:1;position:relative;overflow:hidden;user-select:none;touch-action:none;
    background-color:#eceef1;background-image:radial-gradient(#d5d9df 1px,transparent 1px);background-size:16px 16px}
  .canvas.panning,.canvas.panning *{cursor:grabbing!important}
  .canvas.space{cursor:grab}
  .marquee{position:absolute;border:1px solid var(--ui-accent);background:rgba(29,155,240,.08);pointer-events:none;z-index:4}
  .marquee[hidden]{display:none}
  .multi-note{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#e8f4fd;border:1px solid #b9dcf7;color:#0b5c99;border-radius:10px;padding:8px 10px;margin-bottom:12px;font-size:13px}
  .multi-note .grow{min-width:0}
  .multi-note .btn{padding:4px 9px;font-size:12px}
  .obj-bar{display:flex;align-items:center;gap:6px;margin:0 0 10px}
  .obj-bar b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
  .obj-bar .btn.danger{color:#d4213d}
  .obj-bar .btn.danger:hover{border-color:#d4213d;background:#fde8ea}
  #world{position:absolute;left:0;top:0;transform-origin:0 0}
  .board{position:absolute;cursor:pointer}
  .board.sel{cursor:default;outline:2px solid var(--ui-accent);outline-offset:6px}
  .board:not(.sel):hover{outline:1px solid rgba(29,155,240,.55);outline-offset:6px}
  .board-label{position:absolute;left:0;bottom:100%;margin-bottom:10px;max-width:100%;font-size:13px;font-weight:600;color:var(--ui-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .board.sel .board-label{color:var(--ui-accent)}
  .zoom-ui{position:absolute;right:14px;bottom:14px;display:flex;gap:2px;background:#fff;border:1px solid var(--ui-border);border-radius:10px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .zoom-ui button{font:inherit;font-size:13px;border:0;background:transparent;border-radius:7px;padding:5px 9px;cursor:pointer;color:var(--ui-text);min-width:32px}
  .zoom-ui button:hover{background:#eef0f3}
  .canvas-hint{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--ui-muted);background:rgba(255,255,255,.85);padding:5px 9px;border-radius:8px;pointer-events:none}
  .capture{display:inline-block}
  .capture.framed{padding:40px;background:linear-gradient(135deg,#7f5cff 0%,#1d9bf0 55%,#2fd3c3 100%)}
  .capture.framed .tw-root{border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden}
  .tcard.flash,.blk.flash{animation:flash 1.2s ease}
  /* email editor */
  textarea.sm{min-height:0}
  .row4c{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  input[type=color]{width:100%;height:34px;padding:2px;border:1px solid var(--ui-border);border-radius:8px;background:#fff;cursor:pointer}
  img.thumb{width:44px;height:34px;object-fit:cover;border-radius:6px;border:1px solid var(--ui-border)}
  .hint code{font-size:11px;background:#eef0f3;border-radius:4px;padding:0 4px}
  details.blk{padding:0}
  details.blk summary{list-style:none;display:flex;align-items:center;gap:6px;padding:9px 8px 9px 12px;cursor:pointer;user-select:none}
  details.blk summary::-webkit-details-marker{display:none}
  details.blk summary::before{content:'';flex:none;width:0;height:0;border-left:5px solid var(--ui-muted);border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
  details.blk[open] summary::before{transform:rotate(90deg)}
  .blk-type{font-size:13px;font-weight:700;flex:none}
  .blk-snip{font-size:12px;color:var(--ui-muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .blk-body{padding:0 14px 14px;border-top:1px solid var(--ui-border)}
  .add-blk{margin-top:4px}

  /* ---------- Slack rendering ---------- */
  .sl-root{--s-bg:#1a1d21;--s-text:#d1d2d3;--s-strong:#f8f8f8;--s-muted:#ababad;--s-men:#1d9bd1;--s-men-bg:rgba(29,155,209,.1);
    --s-self:#f2c744;--s-self-bg:rgba(242,199,68,.15);--s-react:rgba(255,255,255,.07);
    background:var(--s-bg);color:var(--s-text);font:15px/1.46668 Lato,"Slack-Lato",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding:14px 20px 16px;-webkit-font-smoothing:antialiased;box-sizing:border-box}
  .sl-root.light{--s-bg:#fff;--s-text:#1d1c1d;--s-strong:#1d1c1d;--s-muted:#616061;--s-men:#1264a3;--s-men-bg:rgba(29,155,209,.1);
    --s-self:#1d1c1d;--s-self-bg:rgba(242,199,68,.4);--s-react:rgba(29,28,29,.06)}
  .sl-msg{display:flex;gap:8px}
  .sl-av{width:36px;height:36px;border-radius:6px;object-fit:cover;flex:none;display:block;margin-top:4px}
  .sl-av.init{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
  .sl-main{flex:1;min-width:0}
  .sl-head{display:flex;align-items:baseline;gap:8px}
  .sl-name{color:var(--s-strong);font-weight:900}
  .sl-time{color:var(--s-muted);font-size:12px}
  .sl-body{overflow-wrap:anywhere}
  .sl-body b{color:var(--s-strong);font-weight:700}
  .sl-line{min-height:22px}
  .sl-gap{height:8px}
  .sl-ul{margin:0;padding-left:26px;list-style:disc}
  .sl-ul.d1{list-style:circle}
  .sl-ul.d2{list-style:square}
  .sl-ul li{padding-left:2px}
  .sl-men{color:var(--s-men);background:var(--s-men-bg);border-radius:3px;padding:0 2px}
  .sl-men.self{color:var(--s-self);background:var(--s-self-bg)}
  .sl-code{font:12px/1.5 Monaco,Menlo,Consolas,monospace;color:#e8912d;background:rgba(232,232,232,.04);border:1px solid rgba(232,232,232,.13);border-radius:3px;padding:1px 3px}
  .sl-edited{color:var(--s-muted);font-size:13px}
  .sl-reacts{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
  .sl-react{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:12px;background:var(--s-react);font-size:12px}
  .sl-react b{font-weight:600}
  textarea.sl-src{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace}

  /* ---------- Email rendering ---------- */
  .em-root{--c-bg:#fff;--c-text:#1f1f1f;--c-muted:#5f6368;--c-line:#e8eaed;--c-read:#f2f6fc;
    background:var(--c-bg);color:var(--c-text);width:760px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .em-root.mobile{width:390px}
  .em-root.dark{--c-bg:#1f1f1f;--c-text:#e3e3e3;--c-muted:#9aa0a6;--c-line:#3c4043;--c-read:#2a2b2e}
  .em-client{padding:22px 24px 18px}
  .mobile .em-client{padding:18px 16px 14px}
  .em-subj{font-size:22px;line-height:28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mobile .em-subj{font-size:20px;line-height:26px}
  .em-chip{font-size:12px;line-height:18px;background:var(--c-line);color:var(--c-muted);border-radius:4px;padding:0 6px}
  .em-from{display:flex;align-items:flex-start;gap:12px;margin-top:16px}
  .em-av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;display:block}
  .em-av.init{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:17px}
  .em-who{flex:1;min-width:0;font-size:14px;line-height:20px}
  .em-who b{font-weight:600}
  .em-addr,.em-to,.em-time{color:var(--c-muted);font-size:12px}
  .em-time{white-space:nowrap}
  .em-body{background:var(--e-bg);padding:32px 24px;font-family:var(--e-font);color:var(--e-text)}
  .mobile .em-body{padding:0}
  .em-card{max-width:600px;margin:0 auto;background:var(--e-card);border-radius:var(--e-radius);padding:36px 40px;
    --e-muted:color-mix(in srgb,var(--e-text) 60%,var(--e-card));--e-line:color-mix(in srgb,var(--e-text) 14%,var(--e-card))}
  .mobile .em-card{border-radius:0;padding:24px 20px}
  .eb{margin-bottom:20px}
  .eb:last-child{margin-bottom:0}
  .eb h1,.eb h2,.eb h3,.eb h4,.eb p,.eb ul,.eb ol{margin:0}
  .eb-h1{font-size:30px;line-height:38px;font-weight:700;letter-spacing:-.01em}
  .eb-h2{font-size:23px;line-height:30px;font-weight:700}
  .eb-h3{font-size:18px;line-height:26px;font-weight:700}
  .mobile .eb-h1{font-size:26px;line-height:33px}
  .em-text,.em-list{font-size:16px;line-height:1.6}
  .em-text a,.eb-foot a{color:var(--e-accent);text-decoration:underline}
  .em-list{padding-left:22px}
  .em-list li{margin:4px 0}
  .em-btn{display:inline-block;background:var(--e-accent);color:#fff;font-weight:600;font-size:15px;line-height:20px;padding:12px 24px;border-radius:var(--e-radius)}
  .em-btn.full{display:block;text-align:center}
  .eb-logo{display:inline-block;height:auto;border-radius:calc(var(--e-radius) * .6)}
  .eb-logotext{font-size:18px;font-weight:700}
  .eb-img,.eb-cimg{display:block;width:100%;height:auto;border-radius:calc(var(--e-radius) * .8)}
  .eb-cimg{margin-bottom:10px}
  .eb-ph,.eb-blocked{display:flex;align-items:center;justify-content:center;text-align:center;aspect-ratio:16/9;padding:12px;font-size:13px;color:var(--e-muted);
    background:color-mix(in srgb,var(--e-text) 6%,var(--e-card));border:1px dashed color-mix(in srgb,var(--e-text) 25%,var(--e-card))}
  .eb-blocked{border-style:solid}
  .eb-logo-blocked{display:inline-flex;aspect-ratio:auto;padding:6px 10px;border-radius:6px}
  .eb-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .mobile .eb-cols{grid-template-columns:1fr}
  .eb-col h4{font-size:17px;line-height:24px;margin-bottom:4px}
  .eb-col .em-text{font-size:15px}
  .eb-box{background:color-mix(in srgb,var(--e-accent) 10%,var(--e-card));border-radius:var(--e-radius);padding:16px 18px}
  .eb-box .bx-t{display:block;margin-bottom:4px;font-size:16px;font-weight:700}
  .eb-hr{border:0;height:1px;background:var(--e-line);margin:4px 0}
  .eb-foot{font-size:12px;line-height:18px;color:var(--e-muted);text-align:center}
  .eb-foot-links{margin-top:6px}
  .liq-miss{background:#fde68a;color:#92400e;border-radius:3px;padding:0 3px;font-family:ui-monospace,Menlo,monospace;font-size:.85em}
  /* inbox list */
  .em-inbox{padding-bottom:4px}
  .ib-h{padding:14px 20px 10px;font-size:15px;font-weight:600;border-bottom:1px solid var(--c-line)}
  .ib-row{display:flex;align-items:center;gap:14px;height:44px;padding:0 20px;font-size:14px;border-bottom:1px solid var(--c-line);background:var(--c-read)}
  .ib-row.unread{background:var(--c-bg)}
  .mobile .ib-h{border-bottom:0;font-size:13px;color:var(--c-muted);padding:14px 16px 6px}
  .mobile .ib-row{height:auto;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:0;background:var(--c-bg)}
  .ib-ico{display:flex;gap:10px;color:var(--c-muted);flex:none}
  .ib-ico svg{width:18px;height:18px}
  .ib-from{width:170px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib-mid{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib-pre{color:var(--c-muted);font-weight:400}
  .ib-time{flex:none;font-size:12px}
  .ib-m{flex:1;min-width:0}
  .ib-l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .mobile .ib-from{width:auto;font-size:15px}
  .mobile .ib-subj{font-weight:700;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile .ib-pre{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:20px}
  .skb{height:9px;border-radius:5px;background:var(--c-line);margin:5px 0}
  .ib-row.sk{opacity:.75}
  .sk-av{background:var(--c-line)}
  @keyframes flash{0%,40%{border-color:var(--ui-accent);box-shadow:0 0 0 3px rgba(29,155,240,.25)}100%{box-shadow:none}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:#1b1f24;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
  .modal{position:fixed;inset:0;background:rgba(15,20,25,.45);display:flex;align-items:center;justify-content:center;z-index:10;padding:24px}
  .modal[hidden]{display:none}
  .modal-box{background:#fff;border-radius:14px;padding:18px;max-width:min(680px,100%);max-height:100%;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal-box p{margin:0;font-size:13px;color:var(--ui-muted)}
  .modal-box img{max-width:100%;min-height:0;flex:1;object-fit:contain;border:1px solid var(--ui-border);border-radius:8px}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- Tweet rendering ---------- */
  .tw-root{
    --bg:#fff;--text:#0f1419;--muted:#536471;--border:#eff3f4;--link:#1d9bf0;--line:#cfd9de;--mborder:#cfd9de;
    background:var(--bg);color:var(--text);
    font-family:"TwitterChirp",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .tw-root[data-theme=dim]{--bg:#15202b;--text:#f7f9f9;--muted:#8b98a5;--border:#38444d;--line:#425364;--mborder:#38444d}
  .tw-root[data-theme=dark]{--bg:#000;--text:#e7e9ea;--muted:#71767b;--border:#2f3336;--line:#333639;--mborder:#2f3336}
  .tw{position:relative;display:flex;gap:8px;padding:12px 16px}
  .tw-mhdr{display:flex;align-items:center;gap:28px;height:53px;padding:0 16px;font-size:17px;border-bottom:1px solid var(--border)}
  .tw-mhdr svg{width:20px;height:20px}
  .av-col{flex:none;width:40px;position:relative}
  .av{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block;background:#ccd6dd}
  .av.sq{border-radius:4px}
  .av.init{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px}
  .tline{position:absolute;left:19px;width:2px;top:44px;bottom:-20px;background:var(--line)}
  .tline.above{top:-12px;bottom:auto;height:8px}
  .body{flex:1;min-width:0}
  .hdr{display:flex;align-items:center;gap:4px;font-size:15px;line-height:20px;min-width:0}
  .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .muted{color:var(--muted)}
  .hdr .handle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-shrink:1}
  .hdr .when{white-space:nowrap;flex:none}
  .badge{width:18px;height:18px;flex:none}
  .tools{margin-left:auto;color:var(--muted);flex:none;display:flex;align-items:center;gap:14px;padding-left:8px}
  .tools svg{width:18.75px;height:18.75px}
  .tools .grok{color:var(--text);opacity:.75}
  .text{font-size:15px;line-height:20px;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:2px}
  .text:empty{display:none}
  .text a{color:var(--link);text-decoration:none}
  .show-more{color:var(--link);font-size:15px;line-height:20px;margin-top:2px}
  .media{margin-top:12px;border:1px solid var(--mborder);border-radius:16px;overflow:hidden;display:grid;gap:2px;background:var(--border)}
  .media.m1{display:block}
  .media.m1 img{width:100%;max-height:510px;object-fit:cover;display:block}
  .media.m1 video{width:100%;max-height:510px;display:block;background:#000}
  .media.m2{grid-template-columns:1fr 1fr;aspect-ratio:16/9}
  .media.m3,.media.m4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:16/9}
  .media.m3 .mi:first-child{grid-row:1/3}
  .mi{position:relative;overflow:hidden;min-height:0;background:#000}
  .media:not(.m1) img,.media:not(.m1) video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .dur{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.77);color:#fff;font-size:13px;line-height:16px;padding:2px 6px;border-radius:4px;z-index:2;font-weight:500}
  .mute{position:absolute;right:12px;bottom:12px;width:32px;height:32px;border-radius:50%;border:0;padding:0;background:rgba(15,20,25,.75);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2;cursor:pointer}
  .mute svg{width:18px;height:18px}
  .dur:empty{display:none}
  .vid video{cursor:pointer}
  /* link preview cards */
  .lcard{margin-top:12px;border:1px solid var(--mborder);border-radius:16px;overflow:hidden;position:relative;background:var(--border)}
  .lcard.large{aspect-ratio:1.91/1}
  .lcard.large img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .lc-title{position:absolute;left:12px;bottom:12px;max-width:calc(100% - 24px);background:rgba(0,0,0,.77);color:#fff;font-size:13px;line-height:16px;padding:2px 6px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lc-from{color:var(--muted);font-size:13px;line-height:16px;margin-top:4px}
  .lcard.small{display:flex;align-items:stretch;background:var(--bg)}
  .lc-icon{flex:none;width:130px;min-height:130px;display:flex;align-items:center;justify-content:center;background:var(--border);color:var(--muted);border-right:1px solid var(--mborder)}
  .lc-icon svg{width:30px;height:30px}
  .lc-text{padding:12px;display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:15px;line-height:20px;min-width:0}
  .lc-text .muted{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
  .act{display:flex;align-items:center;gap:4px;min-width:0}
  .act svg{width:18.75px;height:18.75px;flex:none}
  .act.liked{color:#f91880} .act.liked svg{fill:#f91880}
  .act.rt{color:#00ba7c}
  .act.bm svg{fill:var(--link)} .act.bm{color:var(--link)}
  .acts .right{display:flex;gap:12px}
  /* detail */
  .detail{display:block;padding:12px 16px 0;position:relative}
  .detail:not(.solo){border-bottom:1px solid var(--border)}
  .detail .d-av{position:relative;flex:none}
  .d-hdr{display:flex;gap:8px;align-items:center}
  .d-hdr .who{min-width:0;flex:1}
  .d-hdr .namerow{display:flex;align-items:center;gap:4px;font-size:15px;line-height:20px}
  .d-hdr .handle{font-size:15px;line-height:20px}
  .detail .text{font-size:17px;line-height:24px;margin-top:12px}
  .d-meta{margin:16px 0;font-size:15px;line-height:20px;color:var(--muted)}
  .d-meta b{color:var(--text)}
  .detail .acts{border-top:1px solid var(--border);padding:4px 4px;height:52px;margin:0}
  .detail .acts svg{width:22.5px;height:22.5px}
  .detail .acts .act span{font-size:14px}
</style>

<div class="app">

function parseSample(s) { // "first_name: Alex" per line
  const o = {};
  String(s || '').split('\n').forEach(l => { const m = l.match(/^\s*([\w.]+)\s*[:=]\s*(.*)$/); if (m) o[m[1]] = m[2].trim(); });
  return o;
}
const LIQUID_RE = /\{\{\s*(?:customer\.)?([\w.]+)\s*\}\}/g;
const liquidPlain = (raw, data) => String(raw || '').replace(LIQUID_RE, (all, k) => k in data ? data[k] : all);
function emText(raw, data) { // escape, fill {{placeholders}}, then **bold**, [links](url) and line breaks
  return esc(raw)
    .replace(LIQUID_RE, (all, k) => k in data ? esc(data[k]) : `<span class="liq-miss">${all}</span>`)
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a>$1</a>')
    .replace(/\n/g, '<br>');
}
function emailTime(str, short) {
  const d = new Date(str); if (isNaN(d)) return '';
  const t = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === new Date().toDateString()) return t;
  return short ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
    : d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + t;
}
function emImg(src, alt, m, cls) {
  if (!src) return `<div class="${cls} eb-ph">Image — upload one in the editor</div>`;
  if (m.blockImages) return `<div class="${cls} eb-blocked">${esc(alt || 'Image')}</div>`;
  return `<img class="${cls}" src="${esc(src)}" alt="${esc(alt)}">`;
}

    case 'paragraph': return `<p class="em-text"${al}>${emText(bk.text, data)}</p>`;
    case 'button': return `<div${al}><span class="em-btn${bk.full ? ' full' : ''}">${emText(bk.label, data)}</span></div>`;

const readDataURL = f => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

// Reading a file is async, so the user may switch mocks or canvases before it finishes. Uploads
// write to the mock that started them, and redraw it only if it's still on the open canvas.
function finishUpload(owner) {
  if (owner === state) return refresh();
  if (doc.mocks.includes(owner)) renderMock(owner);
  save();
}
// `t` is the tweet object itself, not its index, so reordering tweets mid-read can't misdirect the files
async function addFiles(t, files, owner = state) {
  let skipped = 0;
  for (const f of files) {
    if (t.media.length >= 4) { skipped++; continue; }
    if (f.type.startsWith('video/')) t.media.push({ type: 'video', src: URL.createObjectURL(f) });
    else if (f.type.startsWith('image/')) t.media.push({ type: 'image', src: await readDataURL(f) });
  }
  if (skipped) toast('Max 4 media items per tweet');
  finishUpload(owner);
}

function pick(kind, target, i) {
  // Resolve the destination now: paths like blocks.3.src hold indexes that can shift while the file is read
  const owner = state, tweet = owner.tweets?.[i];
  const parentPath = target?.split('.').slice(0, -1).join('.'), key = target?.split('.').at(-1);
  const parent = kind === 'media' ? null : (parentPath ? getPath(owner, parentPath) : owner);
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = kind === 'media' ? 'image/*,video/*' : 'image/*';
  inp.multiple = kind === 'media';
  inp.onchange = async () => {
    if (!inp.files.length) return;
    if (kind === 'media') return addFiles(tweet, inp.files, owner);
    parent[key] = await readDataURL(inp.files[0]); finishUpload(owner);
  };
  inp.click();
}

const ed = $('#editor');
ed.addEventListener('input', e => {

// <details> toggle events don't bubble, so listen in the capture phase
ed.addEventListener('toggle', e => {

ed.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b || b.disabled) return;
  if (b.closest('summary')) e.preventDefault(); // buttons in a block's header shouldn't also open/close it

    case 'blk-dup': B.splice(i + 1, 0, { ...structuredClone(B[i]), id: uid() }); break;
    case 'blk-del': B.splice(i, 1); break;
    case 'set': setPath(state, b.dataset.path, b.dataset.value); break;
    case 'add': {
      const last = T.at(-1);

    }

      if (T.length > 1) T.splice(i, 1);
      if (state.focus === i + 1) state.focus = 0; else if (state.focus > i + 1) state.focus--;
      break;
    case 'up': [T[i - 1], T[i]] = [T[i], T[i - 1]]; if (state.focus === i + 1) state.focus--; else if (state.focus === i) state.focus++; break;
    case 'down': [T[i + 1], T[i]] = [T[i], T[i + 1]]; if (state.focus === i + 1) state.focus++; else if (state.focus === i + 2) state.focus--; break;
    case 'dup': T.splice(i + 1, 0, { ...structuredClone(T[i]), id: uid() }); if (state.focus > i + 1) state.focus++; break;

        const data = structuredClone(currentPresetValue(kind, target)), list = presets[kind];
        const existing = list.findIndex(p => p.name === name);
        if (existing >= 0) list[existing].data = data; // same name = update that preset
        else list.push({ name, data });

        refresh();

    case 'preset-del': {
      const kind = b.dataset.kind, idx = +b.dataset.idx, p = presets[kind][idx]; if (!p) return;
      askConfirm(`Delete the preset “${p.name}”?`).then(ok => {
        if (!ok) return;

      });

    case 'lm-logo': // restore the built-in LM Studio logo (org accounts use square avatars)
      setPath(state, b.dataset.target, SAMPLE_AVATAR);

        T[i].media.push({ type: /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url) ? 'video' : 'image', src: url });
        refresh();
      });
      return;
    }
  }
  refresh();
});

/* ---------------- Export ---------------- */
async function captureBlob(m = state) {
  if (typeof htmlToImage === 'undefined') throw new Error('Export library is missing from this file');
  const node = boardEl(m).querySelector('.capture'), swaps = [];
  // Freeze each video's current frame into an <img> so it shows up in the PNG
  node.querySelectorAll('video').forEach(v => {
    try {
      const c = document.createElement('canvas');
      c.width = v.videoWidth || 640; c.height = v.videoHeight || 360;
      c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
      const img = new Image(); img.src = c.toDataURL('image/png');
      if (v.closest('.m1')) img.style.cssText = 'width:100%;max-height:510px;object-fit:contain;background:#000;display:block';
      v.replaceWith(img); swaps.push([img, v]);
    } catch { /* cross-origin video: leave as is */ }
  });
  try {
    await new Promise(r => setTimeout(r, 30));
    return await htmlToImage.toBlob(node, { pixelRatio: 2 });
  } finally {
    swaps.forEach(([img, v]) => { img.replaceWith(v); v.play().catch(() => {}); });
  }
}
$('#btn-dl').onclick = async () => { // one PNG per selected mock
  const sel = selectedMocks();
  try {
    for (const [i, m] of sel.entries()) {
      const blob = await captureBlob(m);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${fileBase(m)}-${Date.now()}${sel.length > 1 ? '-' + (i + 1) : ''}.png`;
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    }
    toast(sel.length > 1 ? `Downloaded ${sel.length} PNGs` : 'PNG downloaded');
  } catch (err) { console.error(err); toast(err.message || 'Export failed — remote images may block export (CORS)'); }
};
/* ---------------- Copy image ----------------
   Clipboard writes must start inside the click, so the PNG is rendered ahead of time
   (when the pointer reaches the button) and reused if the preview hasn't changed since. */
let prepared = null; // { v, promise, dataURL }
function prepareCopy() {
  if (prepared && prepared.v === previewVersion) return prepared.promise;
  const entry = { v: previewVersion, promise: captureBlob(), dataURL: null };
  entry.promise.then(b => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(b); }))
    .then(d => { entry.dataURL = d; }).catch(() => { if (prepared === entry) prepared = null; });
  prepared = entry;
  return entry.promise;
}
function copyViaSelection(dataURL) { // fallback for browsers without the async Clipboard API
  const box = document.createElement('div');
  box.contentEditable = 'true'; box.style.cssText = 'position:fixed;left:-9999px;top:0';
  const img = new Image(); img.src = dataURL; box.appendChild(img); document.body.appendChild(box);
  const range = document.createRange(); range.selectNode(img);
  const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range);
  let ok = false; try { ok = document.execCommand('copy'); } catch {}
  sel.removeAllRanges(); box.remove();
  return ok;
}
function showCopyModal(blob) { // last resort: show the PNG so it can be right-click copied or dragged
  const url = URL.createObjectURL(blob);
  $('#copy-img').src = url;
  $('#copy-modal').hidden = false;
  $('#copy-dl').onclick = () => { const a = document.createElement('a'); a.href = url; a.download = `${fileBase()}-${Date.now()}.png`; a.click(); };
  $('#copy-close').onclick = () => { $('#copy-modal').hidden = true; URL.revokeObjectURL(url); };
}
// The button lives in the editor, which re-renders, so delegate the hover pre-render to its container
$('#editor').addEventListener('pointerover', e => { if (e.target.closest('[data-action="obj-copy"]')) prepareCopy().catch(() => {}); });
// Some embedded browsers never settle clipboard writes; treat a stalled write as blocked.
const withTimeout = (promise, ms) => Promise.race([promise, new Promise((_, rej) => setTimeout(() => rej(new Error('Clipboard write timed out')), ms))]);
async function copySelectedImage() {
  const p = prepareCopy();
  if (navigator.clipboard?.write && window.ClipboardItem) {
    try { await withTimeout(navigator.clipboard.write([new ClipboardItem({ 'image/png': p })]), 4000); return toast('Image copied to clipboard'); }
    catch (err) {
      console.warn('Clipboard API failed', err);
      // Older engines reject a pending image; retry once with the finished PNG (not worth it if the write stalled)
      if (!/timed out/.test(err.message)) {
        try { await withTimeout(navigator.clipboard.write([new ClipboardItem({ 'image/png': await p })]), 3000); return toast('Image copied to clipboard'); }
        catch (err2) { console.warn('Clipboard API blocked', err2); }
      }
    }
  } else if (prepared?.dataURL && copyViaSelection(prepared.dataURL)) {
    return toast('Image copied to clipboard');
  }
  try { showCopyModal(await p); } catch (err) { console.error(err); toast(err.message || 'Export failed'); }
}
$('#btn-save').onclick = () => {
  // Writes a copy of this editor with all canvases built in — open it anytime to keep editing
  const json = JSON.stringify(book, (k, v) => k === 'media' && Array.isArray(v) ? v.filter(m => !m.src.startsWith('blob:')) : v)
    .replace(/</g, '\\u003c');
  const html = PAGE_SRC.replace(/<script id="preset" type="application\/json">[\s\S]*?<\/script>/,
    () => `<script id="preset" type="application/json">${json}<\/script>`)
    .replace(/<script id="imports" type="application\/json">[\s\S]*?<\/script>/, () => '<script id="imports" type="application/json">[]<\/script>'); // already in the saved canvases
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = 'mocks.html'; a.click();
  if (book.canvases.some(c => c.doc.mocks.some(s => s.tweets?.some(t => t.media.some(m => m.src.startsWith('blob:')))))) toast('Saved — uploaded video files aren’t included');
};
function openSavedFile() {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = async () => {
    let p; try { p = JSON.parse(await inp.files[0].text()); } catch {}
    const loaded = toBook(p);
    if (!loaded) return toast('Not a valid mock file');
    if (!p.mocks && !p.canvases) { // a single mock joins the open canvas
      const m = loaded.canvases[0].doc.mocks[0]; m.id = uid(); Object.assign(m, spotRightOf());
      addMock(m); return toast('Mock added to the canvas');
    }
    if (p.mocks) { // a canvas file: its mocks join the open canvas
      const added = addMocksToCanvas(loaded.canvases[0].doc.mocks);
      return toast(`Added ${added.length} mock${added.length === 1 ? '' : 's'} to “${currentCanvas().name}”`);
    }
    // a whole saved file (several canvases): added alongside the existing canvases, never replacing them
    loaded.canvases.forEach(c => { c.id = uid(); freshIds(c.doc); book.canvases.push(c); });
    switchCanvas(loaded.canvases[0].id); toast(`Added ${loaded.canvases.length} canvas${loaded.canvases.length === 1 ? '' : 'es'}`);

}
function resetFile() {
  askConfirm('Discard all edits (every canvas) and go back to this file’s original mocks?').then(ok => {
    if (!ok) return;
    book = initialBook(); switchCanvas(book.canvases[0].id);
  });
}

/* ---------------- Share links ----------------
   A shared canvas is a secret GitHub gist holding canvas.json; the link is SHARE_BASE#gist=owner/id.
   Anyone with the link can open it (no login), and nobody can find it without the link. Uploading needs
   a GitHub token with the gist scope, kept in this browser only. Sharing a canvas again updates the same
   gist, so its link doesn't change. */
const SHARE_BASE = 'https://morikyl.github.io/social-post-mocker/';
const TOKEN_KEY = 'tweet-mocker-github-token', SHARED_KEY = STORE + ':shared';
const TOKEN_URL = 'https://github.com/settings/tokens/new?scopes=gist&description=Social%20post%20mocker';
const shareLink = share => `${SHARE_BASE}#gist=${share.owner}/${share.id}`;
function shareJSON(canvas) { // uploaded video files can't be shared (they only exist in this tab)
  return JSON.stringify({ mockerShare: 1, canvases: [{ name: canvas.name, doc: canvas.doc }] },
    (k, v) => k === 'media' && Array.isArray(v) ? v.filter(m => !m.src.startsWith('blob:')) : v);
}
const githubApi = (path, method, token, body) => fetch(`https://api.github.com/${path}`, {
  method, body: JSON.stringify(body),
  headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' },
});
async function copyOrShow(link) {
  try { await navigator.clipboard.writeText(link); toast('Link copied: anyone with it can open this canvas'); }
  catch { await askText('Share link: copy it from here', link); }
}
async function shareCanvas() {
  const canvas = currentCanvas();
  let token = readPref(TOKEN_KEY), newToken = false;
  if (!token) {
    window.open(TOKEN_URL, '_blank', 'noopener');
    token = await askText('Paste a GitHub token with the “gist” scope (a page to create one just opened). It stays in this browser and is only used to upload shared canvases.');
    if (!token) return;
    newToken = true;
  }
  const body = { description: `Social post mocker · ${canvas.name}`, public: false, files: { 'canvas.json': { content: shareJSON(canvas) } } };
  $('#btn-share').disabled = true; toast('Uploading…');
  try {
    // Update the gist this canvas was shared as before; if that fails (deleted, or someone else's), make a new one
    let res = canvas.share ? await githubApi(`gists/${canvas.share.id}`, 'PATCH', token, body) : null;
    if (res?.ok !== true) res = await githubApi('gists', 'POST', token, body);
    if (res.status === 401) {
      try { localStorage.removeItem(TOKEN_KEY); } catch {}
      return toast('GitHub didn’t accept that token. Share again to enter a new one.');
    }
    if (!res.ok) return toast(`Couldn’t share: GitHub answered ${res.status}`);
    const gist = await res.json();
    if (newToken) try { localStorage.setItem(TOKEN_KEY, token); } catch {}
    const relink = canvas.share?.id === gist.id;
    canvas.share = { owner: gist.owner.login, id: gist.id }; save();
    await copyOrShow(shareLink(canvas.share));
    if (relink) toast('Link updated: the same link now shows this version');
    if (canvas.doc.mocks.some(m => m.tweets?.some(t => t.media.some(md => md.src.startsWith('blob:'))))) toast('Shared, but uploaded video files aren’t included');
  } catch (err) {
    console.error(err); toast('Couldn’t reach GitHub to share the canvas');
  } finally { $('#btn-share').disabled = false; }
}
$('#btn-share').onclick = shareCanvas;

// Opening a link adds the shared canvas next to your own, never over them. Opening the same version again
// switches to it; a newer version (the sharer updated it) comes in as another canvas.
async function openSharedFromHash() {
  const match = location.hash.match(/gist=([\w-]+)\/([0-9a-f]+)/i); if (!match) return;
  const [, owner, id] = match;
  // The API gives the latest revision's own URL (no CDN lag after an update); it's rate-limited, so fall back to raw
  let raw = `https://gist.githubusercontent.com/${owner}/${id}/raw/canvas.json`, version = 'latest';
  try {
    const res = await fetch(`https://api.github.com/gists/${id}`);
    if (res.ok) { const gist = await res.json(); version = gist.history?.[0]?.version ?? version; raw = gist.files?.['canvas.json']?.raw_url ?? raw; }
  } catch {}
  let shared;
  try { const res = await fetch(raw); if (!res.ok) throw new Error(String(res.status)); shared = toBook(await res.json()); }
  catch { return toast('Couldn’t open that link: the canvas may have been deleted'); }
  if (!shared) return toast('That link doesn’t contain a canvas');
  let opened = {}; try { opened = JSON.parse(localStorage.getItem(SHARED_KEY)) ?? {}; } catch {}
  const key = `${id}@${version}`, here = (opened[key] ?? []).filter(cid => book.canvases.some(c => c.id === cid));
  if (here.length) { if (book.current !== here[0]) switchCanvas(here[0]); return; }
  shared.canvases.forEach(c => { c.id = uid(); delete c.share; freshIds(c.doc); });
  if (firstVisit && Object.keys(opened).length === 0) book.canvases = shared.canvases; // just the sample canvas so far
  else book.canvases.push(...shared.canvases);
  opened[key] = shared.canvases.map(c => c.id);
  try { localStorage.setItem(SHARED_KEY, JSON.stringify(opened)); } catch {}
  switchCanvas(shared.canvases[0].id);
  toast(`Opened “${shared.canvases[0].name}” from a shared link`);
}
window.addEventListener('hashchange', openSharedFromHash);

/* ---------------- Sidebar toggle (UI preference, separate from the mock itself) ---------------- */
// Preferences are a convenience only, and storage can be denied outright (private mode, `file:` URLs),
// so a preference read must never be able to break the first render.
function readPref(key) { try { return localStorage.getItem(key); } catch { return null; } }
const SIDEBAR_KEY = 'tweet-mocker-sidebar-hidden';
function setSidebar(hidden, remember = true) {
  document.querySelector('.app').classList.toggle('no-sidebar', hidden);
  $('#sb-label').textContent = hidden ? 'Show editor' : 'Hide editor';
  $('#btn-sidebar').title = `${hidden ? 'Show' : 'Hide'} editor (⌘\\ / Ctrl+\\)`;
  if (remember) try { localStorage.setItem(SIDEBAR_KEY, hidden ? '1' : ''); } catch {}
}
$('#btn-sidebar').onclick = () => setSidebar(!document.querySelector('.app').classList.contains('no-sidebar'));
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === '\\') { e.preventDefault(); $('#btn-sidebar').click(); }
});
// No saved choice yet: start with the editor hidden on narrow screens (phones, small frames)
const savedSidebar = readPref(SIDEBAR_KEY);
setSidebar(savedSidebar === null ? innerWidth < 720 : savedSidebar === '1', false);

// Drag the editor's right edge to resize it (remembered; double-click the edge to reset)
const SIDEBAR_W_KEY = 'tweet-mocker-sidebar-width', SIDEBAR_W_DEFAULT = 420;
function setSidebarWidth(w) {
  w = Math.round(Math.max(300, Math.min(w, 760, innerWidth - 320)));
  document.querySelector('.app').style.setProperty('--sidebar-w', w + 'px');
  return w;
}
let sidebarW = setSidebarWidth(+readPref(SIDEBAR_W_KEY) || SIDEBAR_W_DEFAULT);
const rememberSidebarW = () => { try { localStorage.setItem(SIDEBAR_W_KEY, String(sidebarW)); } catch {} };
$('#sb-resizer').addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  e.preventDefault();
  const handle = e.currentTarget, left = document.querySelector('.app').getBoundingClientRect().left;
  handle.classList.add('active'); document.body.classList.add('resizing');
  const move = ev => { sidebarW = setSidebarWidth(ev.clientX - left); };
  window.addEventListener('pointermove', move);
  window.addEventListener('pointerup', () => {
    window.removeEventListener('pointermove', move);
    handle.classList.remove('active'); document.body.classList.remove('resizing');
    rememberSidebarW();
  }, { once: true });
});
$('#sb-resizer').addEventListener('dblclick', () => { sidebarW = setSidebarWidth(SIDEBAR_W_DEFAULT); rememberSidebarW(); });
// On window resize, re-clamp the remembered width (so it comes back once the window is wide again)
window.addEventListener('resize', () => { sidebarW = setSidebarWidth(+readPref(SIDEBAR_W_KEY) || SIDEBAR_W_DEFAULT); });

renderEditor();
renderCanvas();
updateCanvasMenu();
const imported = applyImports(); // frames the newly added mocks itself
if (!doc.view && !imported) requestAnimationFrame(() => fitView()); // first open: frame all mocks
save();
openSharedFromHash();
setInterval(() => renderCanvas(), 60000); // keep relative times fresh
</script>
